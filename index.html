<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Fungi Mati: guía para cultivar setas en casa</title>
<style>
:root{
  --bg:#f6f0e1; --card:#fffaf0; --fg:#1c1a15; --muted:#544e42; --line:#d8cdb4;
  --green:#22412c; --green2:#3b6a49; --on-green:#fffaf0; --soft:#e7efe2;
  --warn:#8f2d0f; --warn-bg:#fbe5d6; --ok:#25643a; --water:#4a8cc4;
  --pellet:#a87f4f; --saw:#cfab7b; --myc:#ffffff; --mold:#3d8b37; --gray:#8a8a80;
  --focus:#c45a12;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme=light]){
    --bg:#11150f; --card:#1a2018; --fg:#f2ecdc; --muted:#c3bba8; --line:#3a4535;
    --green:#a6d1ad; --green2:#7fb78b; --on-green:#11150f; --soft:#22301f;
    --warn:#ffb08a; --warn-bg:#3b1f12; --ok:#8fd19f; --water:#7db4e6;
    --pellet:#b98d5a; --saw:#d8b585; --myc:#f4f1e8; --mold:#62b85a; --gray:#9a9a90;
  }
}
:root[data-theme=dark]{
  --bg:#11150f; --card:#1a2018; --fg:#f2ecdc; --muted:#c3bba8; --line:#3a4535;
  --green:#a6d1ad; --green2:#7fb78b; --on-green:#11150f; --soft:#22301f;
  --warn:#ffb08a; --warn-bg:#3b1f12; --ok:#8fd19f; --water:#7db4e6;
  --pellet:#b98d5a; --saw:#d8b585; --myc:#f4f1e8; --mold:#62b85a; --gray:#9a9a90;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;overflow-x:hidden}
a{color:var(--green2)}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding:0 16px}
.wide{max-width:none}
header.top{position:sticky;top:0;z-index:10;background:var(--green);color:var(--on-green)}
.top .row{display:flex;align-items:center;gap:12px;padding:10px 16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:20px;margin-right:auto}
.brand svg{width:30px;height:30px}
.top select{width:auto;max-width:60vw}
.top select,.top button{font:inherit;font-size:16px;min-height:44px;border-radius:10px;border:2px solid var(--on-green);background:transparent;color:var(--on-green);padding:4px 10px}
.top select option{color:#1c1a15;background:#fffaf0}
nav.tabs{display:flex;overflow-x:auto;gap:4px;padding:0 12px 8px;scrollbar-width:none}
nav.tabs a{flex:0 0 auto;color:var(--on-green);text-decoration:none;padding:8px 14px;border-radius:999px;font-weight:600;font-size:17px}
nav.tabs a[aria-current=page]{background:var(--on-green);color:var(--green)}
main{padding:16px 0 48px}
section.view{display:none}
section.view.on{display:block}
h1{font-size:28px;line-height:1.2;margin:8px 0 12px}
h2{font-size:23px;line-height:1.25;margin:28px 0 10px}
h3{font-size:20px;margin:18px 0 8px}
p{margin:8px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin:14px 0}
.lead{font-size:21px;font-weight:600}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.grid2{grid-template-columns:1fr}}
button,.btn{font:inherit;font-weight:600;min-height:48px;padding:10px 16px;border-radius:12px;border:2px solid var(--green);background:var(--card);color:var(--green);cursor:pointer;text-align:left}
button.primary{background:var(--green);color:var(--on-green)}
button:disabled{opacity:.5;cursor:not-allowed}
button.small{min-height:40px;padding:6px 12px;font-size:16px}
button.stage{display:flex;gap:10px;align-items:center;width:100%}
button.stage b{display:inline-grid;place-items:center;min-width:32px;height:32px;border-radius:50%;background:var(--green);color:var(--on-green)}
button.stage[aria-pressed=true]{background:var(--soft)}
ol.steps{padding-left:28px;margin:8px 0}
ol.steps li{margin:8px 0}
.box{border-left:5px solid var(--green2);background:var(--soft);padding:10px 14px;border-radius:8px;margin:10px 0}
.box.warn{border-color:var(--warn);background:var(--warn-bg)}
.warn-t{color:var(--warn);font-weight:700}
.es-below{display:block;margin-top:6px;font-size:16px;color:var(--muted)}
.note{font-size:16px;color:var(--muted)}
.banner{background:var(--warn-bg);border-bottom:2px solid var(--warn);padding:10px 16px;font-size:16px}
details{margin:12px 0}
summary{cursor:pointer;font-weight:700;min-height:44px;display:flex;align-items:center}
.md table{border-collapse:collapse;width:100%;font-size:16px;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:4px solid var(--line);color:var(--muted)}
.md code{font-size:15px;background:var(--soft);padding:1px 4px;border-radius:4px}
label{display:block;font-weight:600;margin:12px 0 4px}
input,select,textarea{font:inherit;width:100%;min-height:48px;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--card);color:var(--fg)}
input[type=checkbox],input[type=radio]{width:24px;min-height:24px;height:24px;vertical-align:middle;margin-right:8px}
label.inline{display:flex;align-items:center;font-weight:500}
.err{color:var(--warn);font-size:16px;font-weight:600;min-height:0}
.field-bad input,.field-bad select{border-color:var(--warn)}
.res{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;align-items:baseline}
.res dt{font-weight:700}
.res dd{margin:0}
.res .big{font-size:22px;font-weight:700}
.anim{margin:12px 0;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px}
.anim svg{display:block;width:100%;height:auto;max-height:340px}
.anim figcaption{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;font-size:16px}
.anim.paused *{animation-play-state:paused!important}
.animgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.media img,.media video{max-width:100%;border-radius:10px;display:block}
/* chat */
#chatlog{display:flex;flex-direction:column;gap:12px;margin:12px 0}
.msg{padding:12px 14px;border-radius:14px;max-width:100%;border:1px solid var(--line);background:var(--card)}
.msg.user{background:var(--soft);align-self:flex-end;max-width:min(100%,760px)}
.msg .who{font-size:14px;font-weight:700;color:var(--muted);margin-bottom:4px}
.msg img{max-width:220px;border-radius:8px;display:block;margin:6px 0}
.msg ol,.msg ul{padding-left:26px;margin:6px 0}
.composer{position:sticky;bottom:0;background:var(--bg);padding:10px 0;border-top:1px solid var(--line)}
.composer textarea{min-height:80px;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
#chatvisual:empty{display:none}
#stagecard,#logform{scroll-margin-top:140px}
.thinking{color:var(--muted);font-style:italic}
table.data{border-collapse:collapse;font-size:15px;width:100%}
table.data th,table.data td{border:1px solid var(--line);padding:6px;text-align:left;white-space:nowrap}
.scrollx{overflow-x:auto;max-width:100%}
.bag{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--card)}
footer{border-top:1px solid var(--line);padding:20px 16px 40px;font-size:16px;color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hidden{display:none!important}
/* svg shared */
.s-ln{stroke:var(--fg);stroke-width:2.5;fill:none;stroke-linecap:round;stroke-linejoin:round}
.s-tx{fill:var(--fg);font:600 13px system-ui,sans-serif}
.s-txs{fill:var(--muted);font:12px system-ui,sans-serif}
.s-warn{fill:var(--warn)}
.s-ok{fill:var(--ok)}
.s-bag{fill:var(--card);stroke:var(--fg);stroke-width:2.5}
.tb{transform-box:view-box}
</style>
</head>
<body>
<script>window.FM_DATA = null; /*@@FM_DATA@@*/</script>
<header class="top">
  <div class="row">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M3 15c0-6 6-11 13-11s13 5 13 11c0 1-1 2-2 2H5c-1 0-2-1-2-2z" fill="currentColor"/><path d="M12 17h8l-1 10c0 1-1 2-3 2s-3-1-3-2z" fill="currentColor" opacity=".75"/></svg><span>Fungi Mati</span></div>
    <label class="sr" for="lang" data-t="lang.label">Idioma</label>
    <select id="lang" aria-label="Idioma"></select>
    <button id="theme" type="button" aria-label="Cambiar modo claro u oscuro"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>
<div id="i18nbanner" class="banner hidden" role="note"></div>
<main>
  <section class="view wrap" id="v-guia"></section>
  <section class="view wrap" id="v-calculadora"></section>
  <section class="view wrap wide" id="v-asistente" style="padding:0 16px"></section>
  <section class="view wrap" id="v-bitacora"></section>
  <section class="view wrap" id="v-fuentes"></section>
</main>
<footer><div class="wrap" id="foot"></div></footer>

<script>
"use strict";
(async function main(){

/* ============ datos ============ */
async function loadData(){
  if (window.FM_DATA) return window.FM_DATA;
  // Copia sin build (por ejemplo GitHub Pages sirviendo la raíz del repo): leer los archivos.
  const txt = p => fetch(p).then(r => r.ok ? r.text() : "").catch(() => "");
  const js = p => fetch(p).then(r => r.ok ? r.json() : null).catch(() => null);
  const langs = ["es","en","nah","yua","tsz","hch"];
  const d = { protocolo: await txt("knowledge/protocolo.md"), fuentes: await txt("knowledge/FUENTES.md"),
    instrucciones: await txt("knowledge/instrucciones-ia.md"), config: (await js("config.json")) || {}, i18n: {} };
  for (const l of langs){ const j = await js("knowledge/i18n/"+l+".json"); if (j) d.i18n[l] = j; }
  return d;
}
const D = await loadData();
const CFG = D.config || {};
const LANGS = ["es","en","nah","yua","tsz","hch"].filter(l => D.i18n && D.i18n[l]);
const INDIG = new Set(["nah","yua","tsz","hch"]);
const STAGES = ["a","b","c","d","e","f"];
const STAGE_BLOCK = {a:"inicio", b:"preparacion", c:"incubacion", d:"fructificacion", e:"cosecha", f:"problemas"};
const STAGE_ANIMS = {
  a:["materiales","hidratacion"], b:["hidratacion","puno","pasteurizacion","inoculacion","sellado","perforaciones"],
  c:["colonizacion","sellado"], d:["fructificacion"], e:["fructificacion"], f:["colonizacion","sellado","puno"]
};
const ANIMS = ["hidratacion","puno","pasteurizacion","inoculacion","sellado","perforaciones","colonizacion","fructificacion","materiales"];
const VIEWS = ["guia","calculadora","asistente","bitacora","fuentes"];

/* ============ almacenamiento local (solo comodidad) ============ */
const LS = {
  get(k, d){ try { const v = localStorage.getItem("fm."+k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v){ try { localStorage.setItem("fm."+k, JSON.stringify(v)); } catch {} }
};

/* ============ estado ============ */
const S = {
  lang: LS.get("lang", null) || "es", // español por defecto
  stage: LS.get("stage", null),
  calc: Object.assign({grams:400, type:"pellet", boilOpen:false, liters:5, pack:""}, LS.get("calc", {})),
  theme: LS.get("theme", "auto"),
};
if (!LANGS.includes(S.lang)) S.lang = "es";
const caps = { sample:null, db:null, user:null, downloads:null, assets:null, uid:null, canEdit:false, imagesOK:false, toolsOK:false, sampleOff:false, resolved:false };

/* ============ i18n ============ */
function t(k, vars){
  let s = (D.i18n[S.lang] && D.i18n[S.lang][k]);
  if (s == null) s = D.i18n.es[k];
  if (s == null) return k;
  if (vars) s = String(s).replace(/\{(\w+)\}/g, (m, n) => vars[n] != null ? vars[n] : m);
  return s;
}
const tes = k => D.i18n.es[k] != null ? D.i18n.es[k] : k;
const isIndig = () => INDIG.has(S.lang);
function cards(){ return (D.i18n[S.lang] && D.i18n[S.lang].cards) || D.i18n.es.cards; }
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (s, r=document) => r.querySelector(s);
/* Una advertencia de seguridad: en lenguas indígenas siempre va también en español debajo. */
function safe(k){
  const main = `<span>${esc(t(k))}</span>`;
  return isIndig() ? main + `<span class="es-below" lang="es">${esc(t("safety.spanishBelow"))} ${esc(tes(k))}</span>` : main;
}

/* ============ markdown mínimo ============ */
function inline(s){
  return s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function md(src){
  src = String(src || "").replace(/<!--[\s\S]*?-->/g, "");
  const lines = esc(src).split(/\r?\n/);
  let out = "", list = null, para = [], i = 0;
  const flushP = () => { if (para.length){ out += "<p>"+inline(para.join(" "))+"</p>"; para = []; } };
  const flushL = () => { if (list){ out += `</${list}>`; list = null; } };
  while (i < lines.length){
    const l = lines[i];
    let m;
    if (/^\s*$/.test(l)){ flushP(); flushL(); i++; continue; }
    if ((m = l.match(/^(#{1,6})\s+(.*)$/))){ flushP(); flushL(); const n = Math.min(6, m[1].length+1); out += `<h${n}>${inline(m[2])}</h${n}>`; i++; continue; }
    if (/^\s*(---|\*\*\*)\s*$/.test(l)){ flushP(); flushL(); out += "<hr>"; i++; continue; }
    if (/^\s*\|/.test(l)){
      flushP(); flushL();
      const rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])){ rows.push(lines[i]); i++; }
      const cells = r => r.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim());
      let h = cells(rows[0]), body = rows.slice(1);
      if (body.length && /^[\s|:-]+$/.test(body[0])) body = body.slice(1);
      out += "<table><thead><tr>"+h.map(c=>"<th>"+inline(c)+"</th>").join("")+"</tr></thead><tbody>"+
        body.map(r=>"<tr>"+cells(r).map(c=>"<td>"+inline(c)+"</td>").join("")+"</tr>").join("")+"</tbody></table>";
      continue;
    }
    if ((m = l.match(/^\s*&gt;\s?(.*)$/))){ flushP(); flushL(); out += "<blockquote>"+inline(m[1])+"</blockquote>"; i++; continue; }
    if ((m = l.match(/^\s*(\d+)[.)]\s+(.*)$/))){ flushP(); if (list !== "ol"){ flushL(); out += "<ol>"; list = "ol"; } out += "<li>"+inline(m[2])+"</li>"; i++; continue; }
    if ((m = l.match(/^\s*[-*•]\s+(.*)$/))){ flushP(); if (list !== "ul"){ flushL(); out += "<ul>"; list = "ul"; } out += "<li>"+inline(m[1])+"</li>"; i++; continue; }
    if (list){ // continuación de un elemento de lista
      out = out.replace(/<\/li>$/, " "+inline(l.trim())+"</li>"); i++; continue;
    }
    para.push(l.trim()); i++;
  }
  flushP(); flushL();
  return `<div class="md">${out}</div>`;
}
/* Bloques del protocolo: <!-- es:id --> ... hasta el siguiente marcador */
function protoBlocks(lg){
  const out = {}; const re = /<!--\s*(es|en):([\w-]+)\s*-->/g;
  const src = D.protocolo || ""; let m, last = null;
  const marks = [];
  while ((m = re.exec(src))) marks.push({lang:m[1], id:m[2], start:m.index, end:re.lastIndex});
  marks.forEach((mk, i) => { if (mk.lang !== lg) return; const stop = i+1 < marks.length ? marks[i+1].start : src.length; out[mk.id] = stripTodo(src.slice(mk.end, stop)).trim(); });
  return out;
}
function protocolForAI(){
  const src = D.protocolo || "";
  const i = src.search(/<!--\s*en:/);
  return stripTodo(i > 0 ? src.slice(0, i) : src).replace(/<!--[\s\S]*?-->/g, "");
}

/* Las notas para el autor no se muestran ni se mandan a la IA. */
function stripTodo(s){ return String(s || "").split(/\r?\n/).filter(l => !/TODO Robert:/.test(l)).join("\n"); }

/* ============ animaciones SVG ============ */
let animSeq = 0;
function kf(name, frames){ return `@keyframes ${name}{${frames}}`; }
function wrapT(x, y, str, max, cls, extra){ // texto SVG en varias líneas
  const words = String(str).split(/\s+/), lines = []; let cur = "";
  for (const w of words){ if ((cur + " " + w).trim().length > max && cur){ lines.push(cur); cur = w; } else cur = (cur + " " + w).trim(); }
  if (cur) lines.push(cur);
  return `<text class="${cls}" x="${x}" y="${y}" text-anchor="middle"${extra||""}>${lines.map((l,i)=>`<tspan x="${x}" dy="${i?14:0}">${esc(l)}</tspan>`).join("")}</text>`;
}
function animSVG(name){
  const u = "a" + (++animSeq); // ids únicos por instancia
  const T = (k) => esc(t(k));
  switch(name){
  case "hidratacion": {
    const pel = [70,92,114,136,158,180,98,150].map((x,i)=>`<rect x="${x}" y="${i>5?150:162}" width="18" height="12" rx="5" fill="var(--pellet)"/>`).join("");
    const dots = Array.from({length:26},(_,i)=>`<circle cx="${70+((i*37)%140)}" cy="${120+((i*13)%50)}" r="2" fill="var(--pellet)"/>`).join("");
    return `<svg viewBox="0 0 320 200" role="img" aria-label="${T("anim.hidratacion")}"><style>
${kf(u+"w","0%{transform:scaleY(0)}35%,100%{transform:scaleY(1)}")}
${kf(u+"p","0%,40%{opacity:1}65%,100%{opacity:0}")}
${kf(u+"s","0%,40%{opacity:0;transform:scaleY(.3)}75%,100%{opacity:1;transform:scaleY(1)}")}
.${u}w{transform-origin:140px 178px;animation:${u}w 5s ease-in-out infinite}
.${u}p{animation:${u}p 5s infinite}
.${u}s{transform-origin:140px 178px;animation:${u}s 5s infinite}
</style>
<path class="s-ln" d="M58 36 V178 H222 V36"/>
<rect class="tb ${u}w" x="60" y="88" width="160" height="90" fill="var(--water)" opacity=".45"/>
<g class="${u}p">${pel}</g>
<g class="tb ${u}s"><path d="M62 178 Q140 104 218 178Z" fill="var(--saw)"/>${dots}</g>
<line x1="52" y1="88" x2="232" y2="88" stroke="var(--water)" stroke-width="2" stroke-dasharray="6 4"/>
<text class="s-tx" x="238" y="92">600 ml</text>
<text class="s-tx" x="238" y="172">400 g</text>
<text class="s-txs" x="238" y="112">× 1.5</text>
</svg>`; }
  case "puno": {
    const fist = (x) => `<g class="tb ${u}f" style="transform-origin:${x+60}px 55px"><rect x="${x+28}" y="28" width="64" height="52" rx="20" fill="var(--saw)" stroke="var(--fg)" stroke-width="2.5"/><path class="s-ln" d="M${x+44} 34v20M${x+58} 32v22M${x+72} 34v20"/></g>`;
    return `<svg viewBox="0 0 360 215" role="img" aria-label="${T("anim.puno")}"><style>
${kf(u+"q","0%,15%{transform:scaleX(1)}35%,70%{transform:scaleX(.88)}90%,100%{transform:scaleX(1)}")}
${kf(u+"d","0%,30%{transform:translateY(0);opacity:0}35%{opacity:1}70%{transform:translateY(60px);opacity:1}75%,100%{opacity:0}")}
${kf(u+"st","0%,30%{transform:scaleY(0)}45%,75%{transform:scaleY(1)}90%,100%{transform:scaleY(0)}")}
${kf(u+"c","0%,30%{transform:translate(0,0) rotate(0);opacity:0}35%{opacity:1}80%{transform:translate(var(--dx),70px) rotate(90deg);opacity:1}90%,100%{opacity:0}")}
.${u}f{animation:${u}q 4s infinite}
.${u}d{animation:${u}d 4s infinite}
.${u}d2{animation-delay:.6s}
.${u}st{transform-origin:0 84px;animation:${u}st 4s infinite}
.${u}c{animation:${u}c 4s infinite}
</style>
${fist(0)}${fist(120)}${fist(240)}
<circle class="${u}d" cx="60" cy="88" r="5" fill="var(--water)"/><circle class="${u}d ${u}d2" cx="64" cy="88" r="4" fill="var(--water)"/>
<rect class="tb ${u}st" x="176" y="84" width="8" height="70" fill="var(--water)"/><ellipse cx="180" cy="158" rx="30" ry="6" fill="var(--water)" opacity=".5"/>
${[-14,-4,6,14,0].map((dx,i)=>`<rect class="${u}c" style="--dx:${dx}px;animation-delay:${i*0.12}s" x="${296+dx/2}" y="84" width="7" height="5" fill="var(--saw)"/>`).join("")}
<text class="s-tx s-ok" x="60" y="186" text-anchor="middle">✓</text>

/* ============ cálculos ============ */
/* Medidas caseras cuantificables. Los valores vienen de config.json ("medidas") para poder calibrarlos sin tocar código. */
const M = Object.assign({tazaMl:240, cucharadaMl:15, cucharaditaMl:5, botellaMl:600, calGL:10, microMinPorKg:15, microTandaMaxG:1000,
  densidad:{pellet:0.65, cal:0.5, micelio:0.6}, paqueteMicelioG:[250,500,1000]}, CFG.medidas || {});
M.densidad = Object.assign({pellet:0.65, cal:0.5, micelio:0.6}, (CFG.medidas || {}).densidad || {});
function frac(n){ // a cuartos, con símbolos
  const q = Math.round(n*4)/4, w = Math.floor(q), r = q - w;
  const f = r === .25 ? "¼" : r === .5 ? "½" : r === .75 ? "¾" : "";
  return (w ? String(w) : (f ? "" : "0")) + f;
}
function smallFrac(x){ const opts = [[1/8,"⅛"],[1/4,"¼"],[1/3,"⅓"],[1/2,"½"],[2/3,"⅔"],[3/4,"¾"],[1,"1"]]; let best = opts[0]; for (const o of opts) if (Math.abs(o[0]-x) < Math.abs(best[0]-x)) best = o; return best[1]; }
const fmt = (n, d=0) => Number(n).toLocaleString(S.lang === "en" ? "en-US" : "es-MX", {maximumFractionDigits:d, minimumFractionDigits:0});
function cupsOf(ml){ const c = ml / M.tazaMl; if (Math.abs(c-1) < .13) return t("calc.cup1"); if (c < 1) return t("calc.cupFrac", {n: smallFrac(c)}); return t("calc.cups", {n: frac(c)}); }
function bottlesOf(ml){
  if (ml >= 1400){ const b = ml / 1500; if (Math.abs(b - Math.round(b*4)/4) < .06) return t("calc.bigBottles", {n: frac(b)}); }
  const b = ml / M.botellaMl; return b >= .45 ? t("calc.bottles", {n: frac(b)}) : ""; }
/* polvo (cal): gramos → cucharaditas o cucharadas medidoras rasas */
function spoonsOf(g, dens){
  const ml = g / dens, tsp = ml / M.cucharaditaMl;
  if (tsp < 1.1) return t("calc.tspFrac", {n: smallFrac(tsp)});
  if (tsp < 3) return frac(tsp) === "1" ? t("calc.tsp1") : t("calc.tsp", {n: frac(tsp)});
  const tb = frac(ml / M.cucharadaMl); return tb === "1" ? t("calc.tbsp1") : t("calc.tbsp", {n: tb});
}
function packOf(g, pack){ if (!pack) return ""; const parts = pack / g; if (parts < 1.05) return t("calc.packAll"); return t("calc.pack1n", {n: fmt(Math.round(parts*2)/2, 1), p: fmt(pack)}); }
function calc(){
  const c = S.calc, g = Number(c.grams), pack = Number(c.pack) || 0;
  if (!(g >= 50 && g <= 20000)) return null;
  if (c.type === "fiber"){
    const L = Math.max(1, Number(c.liters) || 5);
    return {type:"fiber", grams:g, liters:L, lime:L*M.calGL, pack};
  }
  const water = g*1.5*(c.boilOpen ? 1.05 : 1);
  const wet = g*2.5, spawn = wet*.10;
  const batches = Math.max(1, Math.ceil(wet / M.microTandaMaxG));
  const perBatch = Math.round(M.microMinPorKg * (wet/batches) / 1000 * 2) / 2;
  return {type:"pellet", grams:g, water, lime: water/1000*M.calGL, wet, spawn, spawnMin:[wet*.03, wet*.05], batches, perBatch, pack};
}
function calcLines(r){
  if (!r) return [];
  const spawnHow = g => [t("calc.spawnCups", {c: cupsOf(g / M.densidad.micelio)}), packOf(g, r.pack)].filter(Boolean).join("; ");
  if (r.type === "fiber") return [
    [t("calc.water"), `${fmt(r.liters,1)} L`, ""],
    [t("calc.lime"), `${fmt(r.lime,1)} g`, spoonsOf(r.lime, M.densidad.cal)],
    [t("calc.fiberStove"), "", t("calc.fiberText")],
    [t("calc.spawn"), "", t("calc.fiberSpawn")],
  ];
  return [
    [t("calc.pellet"), `${fmt(r.grams)} g`, cupsOf(r.grams / M.densidad.pellet)],
    [t("calc.water"), `${fmt(r.water)} ml`, [cupsOf(r.water), bottlesOf(r.water)].filter(Boolean).join(" · ")],
    [t("calc.lime"), `${fmt(r.lime, 1)} g`, spoonsOf(r.lime, M.densidad.cal)],
    [t("calc.wet"), `${fmt(r.wet)} g`, ""],
    [t("calc.spawn"), `${fmt(r.spawn)} g`, spawnHow(r.spawn)],
    [t("calc.spawnMin"), `${fmt(r.spawnMin[0])}–${fmt(r.spawnMin[1])} g`, ""],
    [t("calc.stove"), "", t("calc.stoveText")],
    [t("calc.micro"), "", t("calc.microText", {min: fmt(r.perBatch,1), n: r.batches})],
  ];
}

const mediaSubs = {};
const mediaData = {};
function attachMedia(st){
  for (const k of Object.keys(mediaSubs)) if (k !== st){ mediaSubs[k](); delete mediaSubs[k]; }
  if (caps.db && !mediaSubs[st]){
    try { mediaSubs[st] = caps.db.doc("media/"+st).onSnapshot(s => { mediaData[st] = s.exists ? (s.data().items || []) : []; renderMedia(st); }, () => {}); } catch {}
  }
  renderMedia(st);
}
function renderMedia(st){
  const el = $("#media-"+st); if (!el) return;
  const items = mediaData[st] || [];
  let h = "";
  if (items.length) h += `<h3>${esc(t("media.title"))}</h3><div class="animgrid">` + items.map((it,i)=>{
    const src = "/_blob/" + encodeURIComponent(it.id);
    const media = /^video\//.test(it.type) ? `<video controls preload="metadata" src="${src}"></video>` : `<img alt="${esc(it.caption||"")}" src="${src}" loading="lazy">`;
    return `<figure class="anim">${media}<figcaption><span>${esc(it.caption||"")}</span>${caps.assets?`<button type="button" class="small" data-act="media-del" data-i="${i}" data-st="${st}">${esc(t("media.delete"))}</button>`:""}</figcaption></figure>`; }).join("") + `</div>`;
  if (caps.assets && caps.db) h += `<details><summary>${esc(t("media.upload"))}</summary><form data-act="media-up" data-st="${st}"><input type="file" name="f" accept="image/png,image/jpeg,image/webp,image/gif,video/mp4,video/webm" required><label>${esc(t("media.caption"))}</label><input name="cap" maxlength="160"><div class="row" style="margin-top:8px"><button class="primary" type="submit">${esc(t("media.upload"))}</button></div><p class="note" role="status"></p></form></details>`;
  el.innerHTML = h;
}
async function mediaUpload(form){
  const st = form.dataset.st, f = form.f.files[0], msg = form.querySelector("[role=status]");
  if (!f) return;
  if (f.size > 20*1024*1024){ msg.textContent = t("media.tooLarge"); return; }
  msg.textContent = t("media.uploading");
  try {
    const r = await caps.assets.upload(f);
    const ref = caps.db.doc("media/"+st); const s = await ref.get();
    const items = (s.exists ? (s.data().items || []) : []).slice();
    items.push({id:r.id, type:r.contentType, caption: form.cap.value.slice(0,160)});
    await ref.set({items});
    msg.textContent = "";
  } catch(e){ msg.textContent = t("media.error") + (e && e.code === "too_large" ? " " + t("media.tooLarge") : ""); }
}
async function mediaDelete(st, i){
  const items = (mediaData[st] || []).slice(); const it = items[i]; if (!it) return;
  items.splice(i,1);
  try { await caps.db.doc("media/"+st).set({items}); await caps.assets.delete(it.id); } catch {}
}

const HIDE_CODES = new Set(["not_granted","sampling_disabled","not_declared","capability_disabled","capability_removed"]);
function trimTurns(turns){
  const R = new TextEncoder().encode(rules()).length, cap = 200000 - R;
  const out = turns.slice(); let size = out.reduce((a,x)=>a+new TextEncoder().encode(x.content).length, 0);
  while (out.length > 1 && size > cap){ const x = out.shift(); size -= new TextEncoder().encode(x.content).length; }
  while (out.length && out[0].role !== "user") out.shift();
  return out;
}
async function classifyStage(text){
  try {
    const r = await caps.sample.json(`Clasifica en qué etapa de cultivo de setas está la persona según su mensaje. Etapas: a = apenas empieza y no tiene nada; b = ya tiene sustrato y micelio; c = ya inoculó y está incubando; d = la bolsa ya está blanca; e = ya salieron hongos; f = tiene un problema o contaminación. Si no se puede saber, usa null. Responde solo JSON como {"etapa":"b"}.\n\nMensaje: """${text.slice(0,1500)}"""`, {modelTier:"quick"});
    if (r && STAGES.includes(r.etapa)) return r.etapa;
  } catch(e){ if (e && HIDE_CODES.has(e.code)) throw e; }
  return null;
}
function handleSampleError(e, m){
  if (e && HIDE_CODES.has(e.code)){ caps.sampleOff = true; renderChrome(); renderChat(); renderGuide(); return; }
  if (e && e.code === "images_unavailable"){ caps.imagesOK = false; }
  if (e && e.code === "refused") m.text = "";
  else m.text = (e && e.text) || m.text || "";
  if (!e || e.code !== "cancelled") m.note = errText(e && e.code);
}
async function sendChat(text, opts = {}){
  if (chat.busy || !caps.sample) return;
  text = String(text || "").trim();
  const photo = chat.photo;
  if (!text && photo) text = t("chat.diagnoseDefault");
  if (!text) return;
  chat.busy = true;
  const uMsg = {role:"user", text, photoURL: photo ? chat.photoURL : null};
  chat.msgs.push(uMsg);
  const m = {role:"ai", text:"", done:false, status:"chat.thinking"};
  chat.msgs.push(m);
  chat.photo = null; renderPhoto();
  chat.ctl = new AbortController(); const ctl = chat.ctl;
  renderMsgs();
  try {
    if (!S.stage && !photo){
      m.status = "chat.classifying"; renderMsgs();
      const st = await classifyStage(text);
      if (ctl.signal.aborted) throw {code:"cancelled"};
      if (st){ S.stage = st; LS.set("stage", st); }
      m.status = "chat.thinking"; renderMsgs();
    }
    const content = contextLine() + "\n" + (photo ? "[La persona adjuntó una foto de su bolsa para diagnóstico.]\n" : "") + text;
    chat.turns.push({role:"user", content});
    const sopts = {
      cache:false, modelTier:"default", signal: ctl.signal,
      onText: ({text}) => { m.text = text; updateLast(text); }
    };
    if (photo) sopts.images = [photo];
    if (caps.toolsOK) sopts.tools = [{
      name:"showAnimation",
      description:"Muestra en la página, arriba del chat, una de las nueve animaciones: hidratacion, puno, pasteurizacion, inoculacion, sellado, perforaciones, colonizacion, fructificacion, materiales. Devuelve 'mostrada' o un error.",
      inputSchema:{type:"object", properties:{nombre:{type:"string", enum:ANIMS}}, required:["nombre"]},
      execute(input){ const n = String(input && (input.nombre || input.name) || ""); if (!showAnimation(n)) throw new Error("Animación desconocida: "+n); return "mostrada"; }
    }];
    const res = await caps.sample([{role:"user", content: rules()}, ...trimTurns(chat.turns)], sopts);
    m.text = res.text;
    if (res.truncated) m.note = t("chat.cut");
    chat.turns.push({role:"assistant", content: res.text});
    for (const mm of res.text.matchAll(/\[\[mostrar:([a-z]+)\]\]/g)) showAnimation(mm[1]);
  } catch(e){
    handleSampleError(e, m);
    if (m.text) chat.turns.push({role:"assistant", content: m.text});
  } finally {
    m.done = true; chat.busy = false; chat.ctl = null;
    if (!caps.sampleOff){ renderMsgs(); }
  }
}
async function simpler(i){
  const src = chat.msgs[i]; if (!src || !src.text || chat.busy) return;
  chat.busy = true;
  const m = {role:"ai", text:"", done:false, status:"chat.thinking"};
  chat.msgs.push({role:"user", text:t("chat.simpler")}); chat.msgs.push(m);
  chat.ctl = new AbortController(); const ctl = chat.ctl; renderMsgs();
  try {
    const prompt = `Reescribe este texto en lenguaje mucho más simple, para alguien sin estudios técnicos, en el mismo idioma (${langName(S.lang)}). Máximo 5 pasos numerados y cortos. Conserva todas las cantidades y TODAS las advertencias de seguridad. No agregues información nueva. Devuelve solo el texto reescrito.\n\n"""${src.text.slice(0, 8000)}"""`;
    const res = await caps.sample(prompt, {modelTier:"quick", cache:false, signal:ctl.signal, onText:({text})=>{ m.text = text; updateLast(text); }});
    m.text = res.text;
    chat.turns.push({role:"user", content: contextLine()+"\n"+tes("chat.simpler")}); chat.turns.push({role:"assistant", content: res.text});
  } catch(e){ handleSampleError(e, m); }
  finally { m.done = true; chat.busy = false; chat.ctl = null; if (!caps.sampleOff) renderMsgs(); }
}

/* ============ descarga del protocolo personalizado ============ */
function protocolDoc(){
  const r = calc(), cs = cards();
  const includeChat = $("#dlchat") ? $("#dlchat").checked : false;
  const blocks = protoBlocks(S.lang === "en" ? "en" : "es");
  const stageFull = S.stage ? blocks[STAGE_BLOCK[S.stage]] : "";
  const sections = [];
  sections.push({h: t("download.myAmounts"), items: calcLines(r).map(([k,v,h]) => `${k}: ${v}${v&&h?" — ":""}${h}`)});
  for (const s of ["a","b","c","d","e"]){ const c = cs[s]; sections.push({h:`${s}) ${c.title}`, ol:c.steps, extra:[`${t("card.test")}: ${c.test}`, `${t("card.ifWrong")}: ${c.ifWrong}`]}); }
  sections.push({h:t("tests.title"), items:[`${t("tests.fist.title")}: ${t("tests.fist.body")}`, `${t("tests.air.title")}: ${t("tests.air.body")}`]});
  sections.push({h:t("alerts.title"), items:["alerts.green","alerts.sour","alerts.nogrowth","alerts.warranty"].map(k=>t(k) + (isIndig() && k==="alerts.green" ? ` / ${tes(k)}` : ""))});
  sections.push({h:t("safety.title"), items:["safety.lime","safety.noLime","safety.water","safety.ppe","safety.eat","safety.toxic"].map(k=>t(k) + (isIndig() ? ` / ${tes(k)}` : ""))});
  const convo = includeChat ? chat.msgs.filter(m=>m.text).map(m=>`${m.role==="user"?t("chat.you"):t("chat.ai")}: ${m.text}`) : [];
  return {sections, stageFull, convo};
}
function docTXT(){
  const d = protocolDoc(); let s = `FUNGI MATI — ${t("download.title")}\n${new Date().toISOString().slice(0,10)}\n${t("hero.destination")}\n\n`;
  for (const x of d.sections){ s += `== ${x.h} ==\n`; (x.items||[]).forEach(i=>s+=`- ${i}\n`); (x.ol||[]).forEach((i,k)=>s+=`${k+1}. ${i}\n`); (x.extra||[]).forEach(i=>s+=`* ${i}\n`); s += "\n"; }
  if (d.stageFull) s += `== ${t("card.full")} ==\n${d.stageFull.replace(/<!--[\s\S]*?-->/g,"")}\n\n`;
  if (d.convo.length) s += `== ${t("download.conversation")} ==\n${d.convo.join("\n\n")}\n`;
  s += `\n${t("footer.license")} ${CFG.repoUrl || ""}\n`;
  return s;
}
function docHTML(){

async function saveFile(filename, data, msgEl){
  const say = k => { if (msgEl) msgEl.textContent = t(k); };
  if (caps.downloads){
    try { await caps.downloads.save({filename, data}); say("download.saved"); }
    catch(e){ say(e && e.code === "declined" ? "download.declined" : "download.error"); }
    return;
  }
  if (!window.claude){ // copia fuera de Claude (GitHub Pages): descarga normal del navegador
    try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([data], {type: filename.endsWith(".csv") ? "text/csv" : filename.endsWith(".html") ? "text/html" : "text/plain"})); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); say("download.saved"); }
    catch { say("download.error"); }
    return;
  }
  say("download.error");
}

function readForm(f){
  const g = n => f.elements[n] ? f.elements[n].value.trim() : "";
  const n = x => x === "" ? null : Number(x);
  return { bagId:g("bagId"), group:g("group"), date:g("date"), species:g("species"), substrate:g("substrate"),
    dryGrams:n(g("dryGrams")), waterMl:n(g("waterMl")), limeG:n(g("limeG")), method:g("method"), knot:g("knot"), holes:g("holes"),
    env:g("env"), tempC:n(g("tempC")), d7:g("d7"), d14:g("d14"), d21:g("d21"), harvestDate:g("harvestDate"),
    flushes:[0,1,2,3].map(i=>n(g("flush"+i))).filter(x=>x!=null), notes:g("notes") };
}
function validate(v){
  const e = {}, td = today();
  const range = (k, min, max, req) => { if (v[k] == null){ if (req) e[k] = t("log.v.required"); return; } if (!(v[k] >= min && v[k] <= max)) e[k] = t("log.v.range", {min, max}); };
  if (!v.bagId) e.bagId = t("log.v.required");
  else if (LOG.mine.some(b => b.data.bagId.toLowerCase() === v.bagId.toLowerCase() && b.id !== LOG.editing)) e.bagId = t("log.v.duplicateId");
  if (!v.date || !/^\d{4}-\d{2}-\d{2}$/.test(v.date) || isNaN(Date.parse(v.date))) e.date = t("log.v.required");
  else if (v.date > td) e.date = t("log.v.dateFuture");
  else if (v.date < "2020-01-01") e.date = t("log.v.dateOld");
  range("dryGrams", 50, 20000, true); range("waterMl", 0, 30000, true); range("limeG", 0, 100, true); range("tempC", 5, 45, false);
  const age = e.date ? -1 : daysBetween(v.date, td);
  [["d7",7],["d14",14],["d21",21]].forEach(([k,d]) => { if (v[k] && age < d) e[k] = t("log.v.tooEarly"); });
  if (v.harvestDate){
    if (v.harvestDate > td) e.harvestDate = t("log.v.dateFuture");
    else if (!e.date && daysBetween(v.date, v.harvestDate) < 10) e.harvestDate = t("log.v.harvestBefore");
  }
  v.flushes.forEach((x,i)=>{ if (!(x >= 0 && x <= 20000)) e["flush"+i] = t("log.v.range",{min:0,max:20000}); });
  if (v.flushes.some(x=>x>0) && !v.harvestDate) e.harvestDate = t("log.v.required");
  // avisos suaves
  const warns = [];
  if (/^pellet/.test(v.substrate) && v.dryGrams && v.waterMl != null && Math.abs(v.waterMl - v.dryGrams*1.5) > v.dryGrams*0.3) warns.push(t("log.v.ratio", {ml: Math.round(v.dryGrams*1.5)}));
  const sig = x => JSON.stringify([x.date,x.species,x.substrate,x.dryGrams,x.waterMl,x.limeG,x.method,x.knot,x.holes,x.env,x.tempC,x.d7,x.d14,x.d21,x.harvestDate,x.flushes,x.notes]);
  if (LOG.mine.some(b => b.id !== LOG.editing && sig(b.data) === sig(v))) warns.push(t("log.v.copied"));
  return {errors:e, warns};
}
function anon(v, logId){
  return { schema:1, species:v.species, substrate:v.substrate, dryGrams:v.dryGrams, waterMl:v.waterMl, limeG:v.limeG, method:v.method,
    knot:v.knot, holes:v.holes==="si", env:v.env, tempC:v.tempC, inoculationDate:v.date, d7:v.d7||null, d14:v.d14||null, d21:v.d21||null,
    firstHarvestDate:v.harvestDate||null, flushGrams:v.flushes, totalGrams:v.flushes.reduce((a,b)=>a+b,0), group:v.group||null,
    notes:v.notes||null, lang:S.lang, updatedAt:new Date().toISOString() };
}
const rid = () => (crypto.randomUUID ? crypto.randomUUID().replace(/-/g,"") : Math.random().toString(36).slice(2)+Date.now().toString(36)).slice(0,20);
async function saveBag(f){
  const v = readForm(f), {errors, warns} = validate(v);
  f.querySelectorAll("[data-f]").forEach(d => { const k = d.dataset.f; d.classList.toggle("field-bad", !!errors[k]); $("#le-"+k).textContent = errors[k] || ""; });
  $("#logwarn").textContent = warns.join(" ");
  const msg = $("#logmsg");
  if (Object.keys(errors).length){ msg.textContent = t("log.v.fix"); const first = f.querySelector(".field-bad input,.field-bad select"); first && first.focus(); return; }
  if (warns.length && f.dataset.warned !== JSON.stringify(warns)){ f.dataset.warned = JSON.stringify(warns); msg.textContent = warns.join(" "); return; } // segundo clic guarda
  msg.textContent = t("log.saving");
  const prev = LOG.editing ? LOG.mine.find(b => b.id === LOG.editing) : null;
  const id = prev ? prev.id : rid(), logId = prev && prev.data.logId ? prev.data.logId : rid();
  const now = new Date().toISOString();
  const doc = Object.assign({}, v, {logId, createdAt: prev ? prev.data.createdAt : now, updatedAt: now});
  try {
    await caps.db.collection("data/users/"+caps.uid).doc(id).set(doc);
    await caps.db.doc("logs/"+logId).set(anon(v, logId));
    LOG.editing = null; LOG.warn = "";
    renderLog(); $("#logmsg").textContent = t("log.saved");
  } catch(e){
    if (e && e.code === "invalid_argument"){ LOG.readonly = true; renderLog(); return; }
    msg.textContent = e && e.code === "quota_exceeded" ? (e.message || t("log.error")) : t("log.error");
  }
}
async function deleteBag(id){

  if (LOG.delArm !== id){ LOG.delArm = id; renderLogLists(); return; }

  try { await caps.db.collection("data/users/"+caps.uid).doc(id).delete(); if (b.data.logId) await caps.db.doc("logs/"+b.data.logId).delete(); } catch {}

const CSV_COLS = ["logId","inoculationDate","species","substrate","dryGrams","waterMl","limeG","method","knot","holes","env","tempC","d7","d14","d21","firstHarvestDate","flush1","flush2","flush3","flush4","totalGrams","group","lang","updatedAt","notes"];
function csvVal(r, c){
  const d = r.data;
  if (c === "logId") return r.id;
  const m = c.match(/^flush(\d)$/); if (m) return (d.flushGrams||[])[m[1]-1] ?? "";
  const v = d[c]; return v == null ? "" : typeof v === "boolean" ? (v ? "si" : "no") : String(v);
}
function toCSV(rows){
  const q = s => /[",\n\r]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  return "﻿" + CSV_COLS.join(",") + "\r\n" + rows.map(r => CSV_COLS.map(c => q(csvVal(r,c))).join(",")).join("\r\n") + "\r\n";
}
function renderLog(){
  const el = $("#v-bitacora");
  const formVals = LOG.editing ? (LOG.mine.find(b=>b.id===LOG.editing)||{}).data : null;
  if (!caps.db || !caps.uid){
    el.innerHTML = `<h1>${esc(t("log.title"))}</h1><p>${esc(t("log.intro"))}</p><div class="card"><p>${esc(t("log.signin"))}</p></div>`;
    return;
  }
  el.innerHTML = `<h1>${esc(t("log.title"))}</h1><p>${esc(t("log.intro"))}</p>
${LOG.readonly ? `<div class="card"><p>${esc(t("log.readonly"))}</p></div>` : logFormHTML(formVals)}
<h2>${esc(t("log.mine"))}</h2><div id="mybags"></div>
${caps.canEdit ? `<h2>${esc(t("log.all"))}</h2><div class="row"><button type="button" class="primary" data-act="csv">${esc(t("log.export"))}</button></div><p class="note" id="csvmsg" role="status"></p><div id="allbags"></div>` : ""}`;
  renderLogLists();
}
function startLog(){
  if (!caps.db || !caps.uid || LOG.unsubMine) return;
  const timer = setTimeout(() => { LOG.slow = true; renderLogLists(); }, 10000);
  try {
    LOG.unsubMine = caps.db.collection("data/users/"+caps.uid).onSnapshot(s => {
      LOG.mine = s.docs.map(d => ({id:d.id, data:d.data()})).filter(b => b.data && b.data.bagId);
      LOG.loading = false; if (!s.metadata.fromCache){ clearTimeout(timer); LOG.slow = false; }
      renderLogLists();
    }, () => { clearTimeout(timer); LOG.loading = false; renderLogLists(); });
  } catch { LOG.loading = false; }
  if (caps.canEdit){
    try {
      LOG.unsubAll = caps.db.collection("logs").limit(1000).onSnapshot(s => {
        LOG.all = s.docs.map(d => ({id:d.id, data:d.data()})); LOG.allLoading = false; renderLogLists();
      }, () => { LOG.allLoading = false; renderLogLists(); });
    } catch { LOG.allLoading = false; }
  }
}

  if (act === "toggle-anim"){ const f = b.closest(".anim"); const p = !f.classList.contains("paused"); f.classList.toggle("paused", p); b.setAttribute("aria-pressed", p); b.textContent = t(p ? "anim.play" : "anim.pause"); f.querySelectorAll("svg").forEach(s => s.pauseAnimations && (p ? s.pauseAnimations() : s.unpauseAnimations())); }

  else if (act === "chat-reset"){ if (chat.ctl) chat.ctl.abort(); chat.turns = []; chat.msgs = []; renderChat(); }

  else if (act === "simpler"){ simpler(Number(b.dataset.i)); }

});

  }
  if (f && f.id === "logform"){ delete f.dataset.warned; }
});
document.addEventListener("change", e => {
  if (e.target.id === "lang"){ S.lang = e.target.value; LS.set("lang", S.lang); renderAll(); }
  else if (e.target.id === "chatphoto"){ const file = e.target.files[0]; if (!file) return; if (chat.photoURL) URL.revokeObjectURL(chat.photoURL); chat.photo = file; chat.photoURL = URL.createObjectURL(file); renderPhoto(); }
  else if (e.target.form && e.target.form.id === "calcform" && e.target.name === "type"){ S.calc.type = e.target.value; LS.set("calc", S.calc); renderCalc(); }
});
window.addEventListener("hashchange", () => { showView(); scrollTo(0,0); });

applyTheme();
renderAll();

/* ============ capacidades (llegan después, nunca bloquean la guía) ============ */
const use = n => (window.claude && typeof window.claude.use === "function") ? Promise.resolve(window.claude.use(n)).catch(() => null) : Promise.resolve(null);
const [sample, db, user, downloads, assets] = await Promise.all(["sample","db","user","downloads","assets"].map(use));
Object.assign(caps, {sample, db, user, downloads, assets, resolved:true});
if (sample){
  const lim = await sample.limits().catch(() => null);
  caps.imagesOK = !!(lim && lim.images); caps.toolsOK = !!(lim && lim.tools);
  if (lim && lim.images) caps.imageTypes = lim.images.mediaTypes.join(",");
}
if (user){ caps.uid = await user.id(); caps.canEdit = await user.canEdit(); }
renderAll();
startLog();

})();
</script>
</body>
</html>
